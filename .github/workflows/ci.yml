name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            code/requirements.txt
            code/requirements-lock.txt
      - name: Compile Python modules
        run: python -m compileall -q code tests
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
